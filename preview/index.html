<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>APEX Speedometer · Interactive preview</title><link rel="stylesheet" href="/mod/ui/modules/apps/ApexSpeedometer/app.css"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121a20;font-family:'Segoe UI',Arial,sans-serif}.scene{position:absolute;inset:0;background:linear-gradient(180deg,#6c8e9c 0%,#b8bca7 42%,#525c49 42.1%,#242e28 100%);overflow:hidden}.sun{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,#e8d6a24d,transparent 65%);right:-200px;top:-300px}.mountains{position:absolute;inset:24% -10% 42%;background:#3c5759;clip-path:polygon(0 50%,9% 18%,17% 40%,26% 0,35% 70%,45% 37%,57% 68%,70% 9%,78% 45%,87% 18%,100% 63%,100% 100%,0 100%);opacity:.65}.road{position:absolute;top:42%;bottom:-10%;left:8%;right:8%;background:linear-gradient(90deg,#ffffff0c 1px,transparent 1px),#3c4140;background-size:6px 6px;clip-path:polygon(48% 0,52% 0,100% 100%,0 100%)}.road:before,.road:after{content:'';position:absolute;inset:0;background:#d7d6b9;clip-path:polygon(48% 0,48.3% 0,5% 100%,4% 100%)}.road:after{transform:scaleX(-1)}.centerline{position:absolute;top:42%;bottom:-10%;left:49.7%;width:.6%;background:repeating-linear-gradient(180deg,transparent 0 22px,#ddd6ac 22px 48px);transform:perspective(220px) rotateX(25deg);transform-origin:top}.vignette{position:absolute;inset:0;box-shadow:inset 0 0 220px #0008;background:linear-gradient(0deg,#07101599,transparent 40%)}.caption{position:absolute;right:28px;top:26px;color:#eff7ef;font-size:10px;letter-spacing:.15em;text-align:right;line-height:1.9;text-shadow:0 1px 8px #0007}.caption strong{display:block;font-size:14px;font-weight:500;letter-spacing:.2em}.caption small{display:block;color:#cad7d0;font-size:9px}.demo-footer{position:absolute;right:28px;bottom:24px;color:#bac7bf;font-size:10px;letter-spacing:.1em;text-align:right;pointer-events:none}.demo-footer span{display:block;opacity:.65;font-size:9px;margin-top:6px}
</style></head><body><div class="scene" aria-hidden="true"><div class="sun"></div><div class="mountains"></div><div class="road"></div><div class="centerline"></div><div class="vignette"></div></div><div class="caption"><strong>APEX / SPEEDOMETER</strong>INTERACTIVE DESIGN PREVIEW<small>Illustrated backdrop · simulated data · not an in-game screenshot</small></div><div class="demo-footer">NUMBERS. NOTHING ELSE.<span>Right-click the HUD to open settings · Alt + Shift + S</span></div><div class="apex-speedometer"></div><script src="/mod/ui/modules/apps/ApexSpeedometer/app.js"></script><script>window.previewApp=ApexSpeedometer.mount(document.querySelector('.apex-speedometer'),{demo:true});</script></body></html>
